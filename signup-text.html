<!DOCTYPE html>
<html>
<head>
    <title>Registro Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #4A90D9; color: white; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>📝 Registro Test</h1>
    <form id="signupForm">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
        <button type="submit">Registrarse</button>
    </form>
    <div id="resultado"></div>
    <p><a href="login.html">¿Ya tienes cuenta? Inicia sesión</a></p>

    <!-- Cargar CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <script>
        console.log('🔍 Verificando Supabase:', typeof window.supabase)
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            const confirmPassword = document.getElementById('confirmPassword').value
            const resultado = document.getElementById('resultado')
            
            // Verificar que Supabase esté cargado
            if (typeof window.supabase === 'undefined') {
                resultado.innerHTML = '<p class="error">❌ Error: Supabase no está cargado. Recarga la página.</p>'
                return
            }
            
            // Validaciones
            if (!email || !password || !confirmPassword) {
                resultado.innerHTML = '<p class="error">❌ Completa todos los campos</p>'
                return
            }
            
            if (password !== confirmPassword) {
                resultado.innerHTML = '<p class="error">❌ Las contraseñas no coinciden</p>'
                return
            }
            
            if (password.length < 6) {
                resultado.innerHTML = '<p class="error">❌ La contraseña debe tener al menos 6 caracteres</p>'
                return
            }
            
            resultado.innerHTML = '<p>⏳ Registrando usuario...</p>'
            
            try {
                // Crear cliente de Supabase
                const { createClient } = window.supabase
                const supabase = createClient(
                    'https://ibrrrbqundkgokhlvuou.supabase.co',
                    'sb_publishable_qmpThkeEu1eckP1_fPv7rQ_HG9qxVD_'
                )
                
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                })
                
                if (error) {
                    resultado.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`
                    return
                }
                
                resultado.innerHTML = '<p class="success">✅ ¡Registro exitoso! Revisa tu correo para confirmar.</p>'
                
                setTimeout(() => {
                    window.location.href = 'login.html'
                }, 3000)
                
            } catch (error) {
                resultado.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`
                console.error('Error:', error)
            }
        })
    </script>
</body>
</html>
