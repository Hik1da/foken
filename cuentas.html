<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/cuentas.css">
    <title>foken</title>
</head>

<body>


    <div class="app-container">
        <!-- Encabezado superior -->
        <header class="app-header">
            <h1 class="main-title">Mis tarjetas</h1>
            <button class="help-btn" aria-label="Ayuda">?</button>
        </header>

        <!-- Pestañas de estado -->
        <div class="tabs-container">
            <span class="tab-label">Física</span>
            <span class="status-badge">Activa</span>
        </div>

        <!-- Contenedor para la imagen de la tarjeta -->
        <div class="card-image-wrapper">
            <img src="tu-imagen-de-la-tarjeta.png" alt="Tarjeta foken" class="card-image">
        </div>

        <!-- Indicador de carrusel (Paginación) -->
        <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Acciones principales -->
        <main class="actions-grid">
            <button class="action-item button">
                <div class="icon-circle">
                    <!-- Candado -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <span class="action-label">Bloquear</span>
            </button>

            <button class="action-item button">
                <div class="icon-circle">
                    <!-- Escudo -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <span class="action-label">Gestionar NIP</span>
            </button>

            <button class="action-item button">
                <div class="icon-circle">
                    <!-- Tarjeta con signo más -->
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                        <line x1="1" y1="10" x2="23" y2="10"></line>
                        <line x1="12" y1="14" x2="12" y2="18"></line>
                        <line x1="10" y1="16" x2="14" y2="16"></line>
                    </svg>
                </div>
                <span class="action-label">Solicitar nueva</span>
            </button>
        </main>

        <!-- Banner informativo inferior -->
        <footer class="info-banner">
            <div class="info-icon">i</div>
            <p class="info-text">Dudas o claraciones llamar a <strong>Soporte tecnico</strong></p>
        </footer>
    </div>



</body>

</html>
