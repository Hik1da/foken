<!DOCTYPE html>
<html lang="es">
    <head>
        <!-- Configuración de la página -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Hojas de estilo -->
        <link rel="stylesheet" href="styles/home.css">
        <link rel="stylesheet" href="styles/general.css">
        <link rel="stylesheet" href="styles/notifications.css">
        <link rel="stylesheet" href="styles/notifications-float.css">
        <link rel="icon" type="image/png" href="assets/favicon.png">
        <title>notificaciones | foken</title>
    </head>
    <body>
        <!-- Header -->
        <header>
            <!-- Botón para regresar -->
            <a href="home.html" class="back">&#8592;</a>
            <!-- Logo -->
            <img src="assets/logo.png" class="logo" onclick="toggleDarkMode()">
            <!-- Espacio para centrar el logo -->
            <div class="header-space"></div>
        </header>
        <!-- Contenido principal -->
        <main>
            <!-- Título -->
            <h1>Notificaciones</h1>
            <!-- Lista de notificaciones -->
            <section id="notifications">
                <!-- Se llena dinámicamente desde scripts/notifications.js -->
                <p class="sin-notificaciones">Cargando notificaciones...</p>
            </section>
        </main>
        <!-- Ventana flotante -->
        <div class="notification-overlay" id="notificationModal">
            <section class="notification-panel">
                <!-- Encabezado -->
                <div class="notification-panel-header">
                    <h2>Detalle de la notificación</h2>
                    <button
                        type="button"
                        class="notification-close"
                        id="closeNotification"
                    >
                        &times;
                    </button>
                </div>
                <!-- Icono -->
                <div
                    class="notification-panel-icon"
                    id="notificationIcon"
                >
                    <img
                        id="notificationIconImage"
                        src="assets/flat-icons/notification.png"
                        alt="Notificación"
                    >
                </div>
                <!-- Información de la notificación -->
                <div class="notification-content">
                    <h3 id="notificationTitle"></h3>
                    <p id="notificationMessage"></p>
                    <span id="notificationDate"></span>
                </div>
                <!-- Referencia -->
                <div class="notification-detail">
                    <span>Referencia</span>
                    <strong id="notificationReference"></strong>
                </div>
                <!-- Botón -->
                <button
                    type="button"
                    class="notification-button"
                    id="acceptNotification"
                >
                    Entendido
                </button>
            </section>
        </div>
        <footer>
            <a href="home.html"><img src="assets/flat-icons/home.png"></a>
            <a href="cards.html"><img src="assets/flat-icons/card.png"></a>
            <a href="profile.html"><img src="assets/flat-icons/user.png"></a>
        </footer>
        <!-- Script para el modo oscuro -->
        <script src="scripts/darkmode.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script type="module" src="scripts/notifications.js"></script>
    </body>
</html>
