<!DOCTYPE html>
<html lang="es">
    <head>
        <!-- Configuración -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Estilos -->
        <link rel="stylesheet" href="styles/general.css">
        <link rel="stylesheet" href="styles/home.css">
        <link rel="stylesheet" href="styles/movements.css">
        <link rel="stylesheet" href="styles/movements-float.css">
        <title>movimientos | foken</title>
    </head>
    <body>
        <!-- Header -->
        <header>
            <a href="home.html" class="back">&#8592;</a>
            <img src="assets/logo.png" class="logo" onclick="toggleDarkMode()">
            <div class="header-space"></div>
        </header>
        <!-- Contenido -->
        <main>
            <h1>Todos tus movimientos</h1>
            <!-- Buscador -->
            <div class="search">
                <img src="assets/flat-icons/search.png" class="search-icon" alt="Buscar">
                <input type="text" placeholder="Buscar un movimiento">
            </div>
            <!-- Lista: se llena dinámicamente desde scripts/movements.js -->
            <section id="movements">
                <p class="sin-movimientos">Cargando movimientos...</p>
            </section>
        </main>
        <div class="modal-overlay" id="movementModal">
            <section class="transaction-modal">
                <!-- Encabezado -->
                <div class="modal-header">
                    <h2>Detalles de la transacción</h2>
                    <button type="button" class="modal-close" id="closeModal">
                        &times;
                    </button>
                </div>
                <!-- Información principal -->
                <div class="transaction-main">
                    <span id="modalType">Transferencia enviada</span>
                    <h3 id="modalAmount">-$520.00</h3>
                    <p id="modalName">
                        Sebastián Emiliano Campos Orozco
                    </p>
                    <small id="modalDate">
                        14 Jul 2026, 8:20 p. m.
                    </small>
                </div>
                <!-- Resumen -->
                <div class="transaction-summary">
                    <h3>Resumen</h3>
                    <div class="detail-row">
                        <span>Categoría</span>
                        <strong id="modalCategory"></strong>
                    </div>
                    <div class="detail-row">
                        <span>Cuenta</span>
                        <strong id="modalAccount"></strong>
                    </div>
                    <div class="detail-row">
                        <span>Mensaje</span>
                        <strong id="modalMessage"></strong>
                    </div>
                    <div class="detail-row">
                        <span>Folio</span>
                        <strong id="modalFolio"></strong>
                    </div>
                </div>
                <button type="button" class="modal-button" id="acceptModal">
                    Cerrar
                </button>
            </section>
        </div>
        <footer>
            <a href="home.html"><img src="assets/flat-icons/home.png"></a>
            <a href="cards.html"><img src="assets/flat-icons/card.png"></a>
            <a href="profile.html"><img src="assets/flat-icons/user.png"></a>
        </footer>
        <script src="scripts/darkmode.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script type="module" src="scripts/movements.js"></script>
    </body>
</html>
