<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perfil | Foken</title>
        <link rel="stylesheet" href="styles/general.css">
        <link rel="stylesheet" href="styles/home.css">
        <link rel="stylesheet" href="styles/perfil.css">
        <link rel="icon" type="image/png" href="assets/favicon.png">
    </head>
    <body>
        <header>
            <a href="login.html" id="user"><img src="assets/flat-icons/user.png"></a>
            <img src="assets/logo.png" onclick="toggleDarkMode()">
            <a href="notifications.html" id="notification"><img src="assets/flat-icons/notification.png"></a>
        </header>
        <main class="perfil-container">
            <section class="perfil-header">
                <button class="qr-button" id="qrButton" type="button" aria-label="Mostrar código QR">
                    <img src="assets/interactive-icons/QR.png" alt="" class="qr-icon">
                </button>
            </section>

            <section class="usuario-section" aria-labelledby="usuarioNombre">
                <div class="usuario-avatar" id="usuarioAvatar" aria-hidden="true">AA</div>
                <h1 class="usuario-nombre" id="usuarioNombre">Cargando...</h1>
                <p class="usuario-email" id="usuarioEmail">cargando@email.com</p>
            </section>

            <!-- Opciones del perfil -->
            <section class="perfil-opciones" aria-label="Opciones del perfil">
                <button class="perfil-opcion perfil-opcion-button" type="button" id="btnDatosPersonales">
                    <div class="opcion-icono" aria-hidden="true">
                        <img src="assets/flat-icons/persona.png" alt="">
                    </div>
                    <div class="opcion-contenido">
                        <h2 class="opcion-titulo">Datos personales</h2>
                        <p class="opcion-descripcion">Edita tu información personal</p>
                    </div>
                </button>

                <button class="perfil-opcion perfil-opcion-button" type="button" id="btnCambiarPassword">
                    <div class="opcion-icono" aria-hidden="true">
                        <img src="assets/flat-icons/lock.png" alt="">
                    </div>
                    <div class="opcion-contenido">
                        <h2 class="opcion-titulo">Cambiar contraseña</h2>
                        <p class="opcion-descripcion">Actualiza tu contraseña de acceso</p>
                    </div>
                </button>

                <button class="perfil-opcion perfil-opcion-button" type="button" id="btnEliminarCuenta">
                    <div class="opcion-icono" aria-hidden="true">
                        <img src="assets/flat-icons/delete.png" alt="">
                    </div>
                    <div class="opcion-contenido">
                        <h2 class="opcion-titulo" style="color: #d32f2f;">Eliminar cuenta</h2>
                        <p class="opcion-descripcion">Eliminar permanentemente tu cuenta</p>
                    </div>
                </button>
            </section>
        </main>

        <!--  Editar Datos Personales -->
        <div class="modal" id="modalEditar" aria-hidden="true">
            <section class="modal-contenido" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <div class="modal-encabezado-texto">
                        <h2>Editar datos personales</h2>
                    </div>
                    <button class="modal-cerrar" id="cerrarEditar" type="button">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formEditarPerfil">
                        <div class="campo-grupo">
                            <label for="editNombre">Nombre completo</label>
                            <input type="text" id="editNombre" placeholder="Tu nombre completo" required>
                        </div>
                        <div class="campo-grupo">
                            <label for="editEmail">Correo electrónico</label>
                            <input type="email" id="editEmail" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="campo-grupo">
                            <label for="editTelefono">Teléfono</label>
                            <input type="tel" id="editTelefono" placeholder="55 1234 5678">
                        </div>
                        <button type="submit" class="btn-guardar">Guardar cambios</button>
                    </form>
                </div>
            </section>
        </div>

        <!--  Cambiar Contraseña -->
        <div class="modal" id="modalPassword" aria-hidden="true">
            <section class="modal-contenido" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <div class="modal-encabezado-texto">
                        <h2>Cambiar contraseña</h2>
                    </div>
                    <button class="modal-cerrar" id="cerrarPassword" type="button">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formCambiarPassword">
                        <div class="campo-grupo">
                            <label for="passwordActual">Contraseña actual</label>
                            <input type="password" id="passwordActual" placeholder="Tu contraseña actual" required>
                        </div>
                        <div class="campo-grupo">
                            <label for="passwordNueva">Nueva contraseña</label>
                            <input type="password" id="passwordNueva" placeholder="Mín 6 caracteres" required>
                        </div>
                        <div class="campo-grupo">
                            <label for="passwordConfirmar">Confirmar nueva contraseña</label>
                            <input type="password" id="passwordConfirmar" placeholder="Confirmar" required>
                        </div>
                        <button type="submit" class="btn-guardar">Actualizar contraseña</button>
                    </form>
                </div>
            </section>
        </div>

        <!--  Eliminar Cuenta -->
        <div class="modal" id="modalEliminar" aria-hidden="true">
            <section class="modal-contenido" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <div class="modal-encabezado-texto">
                        <h2 style="color: #d32f2f;">Eliminar cuenta</h2>
                    </div>
                    <button class="modal-cerrar" id="cerrarEliminar" type="button">&times;</button>
                </div>
                <div class="modal-body">
                    <p style="color: #d32f2f; font-weight: 600;">Esta acción es irreversible</p>
                    <p>Se eliminarán todos tus datos: perfil, cuentas, tarjetas y movimientos.</p>
                    <form id="formEliminarCuenta">
                        <div class="campo-grupo">
                            <label for="confirmarEliminar">Escribe tu correo para confirmar</label>
                            <input type="email" id="confirmarEliminar" placeholder="tu@email.com" required>
                        </div>
                        <button type="submit" class="btn-eliminar">Eliminar cuenta permanentemente</button>
                    </form>
                </div>
            </section>
        </div>

        <!-- Modal QR -->
        <div class="modal" id="qrModal" aria-hidden="true">
            <section class="modal-contenido qr-modal" role="dialog" aria-modal="true">
                <section class="modal-header">
                    <div class="modal-encabezado-texto">
                        <h2 id="qrTitulo">Código QR</h2>
                    </div>
                    <button class="modal-cerrar" id="cerrarQrButton" type="button">&times;</button>
                </section>
                <div class="modal-body">
                    <p class="modal-texto">Comparte este código QR para recibir transferencias a tu cuenta Foken.</p>
                    <div class="qr-container">
                        <img src="assets/qr-ejemplo.png" alt="Código QR" class="qr-imagen">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-aceptar" id="cerrarQrAceptar" type="button">Cerrar</button>
                </div>
            </section>
        </div>

        <footer>
            <a href="home.html"><img src="assets/flat-icons/home.png"></a>
            <a href="cards.html"><img src="assets/flat-icons/card.png"></a>
            <a href="profile.html" class="selected"><img src="assets/flat-icons/user.png"></a>
        </footer>

        <script src="scripts/darkmode.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script type="module" src="scripts/perfil.js"></script>
    </body>
</html>
