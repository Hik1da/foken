<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/general.css">
        <link rel="stylesheet" href="styles/home.css">
        <link rel="stylesheet" href="styles/interactions.css">
        <title>credito | foken</title>
    </head>
    <body>
        <header>
            <a href="home.html" class="back">&#8592;</a>
            <img src="assets/logo.png" onclick="toggleDarkMode()">
            <div class="header-space"></div>
        </header>
        <main>
            <h1>Transferir fondos a credito</h1>
            <p>Deposita utilizando tu cuenta actual</p>
            <section id="saldo-disponible">
                <h1>Saldo disponible</h1>
                <h2>$<span id="saldo">231.23</span></h2>
                <h1>Credito disponible: $<span id="saldo">231.23</span></h1>
            </section>
            <section id="deposit-container">
                <h1>Realizar el deposito</h1>
                <form id="transferencia-form">
                    <h1>Ingresa cantidad a transferir</h1>
                    <span>$<input id="cantidad" type="number" min="0" placeholder="0">MXN</span>
                    <p>$<span id="saldo">231.23</span> disponibles en tu cuenta de credito</p>
                    <input type="submit" class="button" value="Depositar a cuenta" disabled>
                </form>
            </section>
        </main>
        <footer>
            <a href="home.html"><img src="assets/flat-icons/home.png"></a>
            <a href="cards.html"><img src="assets/flat-icons/card.png"></a>
            <a href=""><img src="assets/flat-icons/user.png"></a>
        </footer>
        <script src="scripts/darkmode.js"></script>
    </body>
</html>
