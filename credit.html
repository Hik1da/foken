<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/general.css">
        <link rel="stylesheet" href="styles/home.css">
        <link rel="stylesheet" href="styles/interactions.css">
        <title>credito | foken</title>
    </head>
    <body>
        <header>
            <a href="home.html" class="back">&#8592;</a>
            <img src="assets/logo.png" onclick="toggleDarkMode()">
            <div class="header-space"></div>
        </header>
        <main>
            <h1>Convertir crédito a saldo</h1>
            <p>Usa tu crédito disponible para abonar a tu cuenta de débito</p>
            <section id="saldo-disponible">
                <h1>Saldo disponible</h1>
                <h2>$<span id="saldoDebito">***.**</span></h2>
                <h1>Credito disponible: $<span id="saldoCredito">***.**</span></h1>
            </section>
            <h1>Realizar la conversión</h1>
            <section id="deposit-container">
                <br>
                <form id="transferencia-form">
                    <h1>Ingresa cantidad a transferir</h1>
                    <span>$<input id="cantidad" type="number" min="0" placeholder="0">MXN</span>
                    <p>$<span id="saldoCreditoForm">***.**</span> disponibles en tu cuenta de credito</p>
                    <input type="submit" class="button" value="Depositar a cuenta" disabled>
                </form>
            </section>
        </main>
        <footer>
            <a href="home.html"><img src="assets/flat-icons/home.png"></a>
            <a href="cards.html"><img src="assets/flat-icons/card.png"></a>
            <a href="profile.html"><img src="assets/flat-icons/user.png"></a>
        </footer>
        <script src="scripts/darkmode.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script type="module" src="scripts/credit.js"></script>
    </body>
</html>
